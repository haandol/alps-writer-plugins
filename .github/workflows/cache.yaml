name: Cache

# main 범위에 pnpm 의 lockfile 검증 기록을 남긴다. pnpm 11 은 설치 전에 lockfile 의 모든 항목을
# 레지스트리와 대조하는데, pnpm/setup 이 그 판정을 캐시에 두면 같은 lockfile 의 다음 설치는 그
# 대조를 건너뛴다. pull request 실행은 자기 브랜치와 main 의 캐시만 읽고, CI 는 main 에서 pull
# request 가 이미 통과한 job 을 건너뛰므로, main 에 push 될 때마다 여기서 설치해 그 기록을 main
# 범위에 저장한다. 같은 lockfile 의 기록이 이미 있으면 복원해서 쓴다. CI 와 따로 돌아서 릴리스를
# 늦추지 않는다.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfile-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Installs pnpm from packageManager and runs `pnpm install --frozen-lockfile`, which
      # saves the verification record once the install finishes.
      - name: Install pnpm and the dependencies
        uses: pnpm/setup@v3
        with:
          node-version-file: false
          require-lockfile: true
