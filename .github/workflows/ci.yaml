name: CI

# 테스트·빌드·포맷 게이트. pre-push 훅이 같은 검사를 로컬에서 돌리지만, 훅은
# `pnpm install`을 한 사람에게만 설치되고 `--no-verify`로 우회할 수 있다.
# 여기서 한 번 더 막는다. 로컬 pnpm test의 전체 검증을 test와 runtime에 나누고,
# build / format:check / bump:check는 로컬과 같은 스크립트로 실행한다.
#
# Node 는 전부 24 로 통일한다(engines.node ">= 24"). 낮은 버전을 매트릭스로 돌려봤자
# pnpm 11 은 node:sqlite 때문에 >= 22.13 을, `node --test` 의 glob 은 21+ 을 요구해서
# 설치·실행 자체가 안 되기 때문이다 — 검증되지 않는 하한을 선언해 두는 대신 선언을
# 실제에 맞췄다.
#
# job 세 개:
#   test       — 워크스페이스 검증·ALPS·DeepEval·브라우저 테스트를 실행한다.
#   build      — 설치 전에 adr-writer 유닛 테스트를 돌리고, lint·포맷·버전·빌드와 커밋된
#                번들의 일치를 검증한다.
#   runtime    — 소비자가 실제로 실행하는 것(번들·스크립트·훅)을 install 없이 검증한다.
#                마켓플레이스 설치본에는 node_modules 가 없으므로, 위 두 job 이 통과해도
#                이쪽이 깨질 수 있다. 의존성 없는 테스트는 build 의 설치 전 단계와 이 job 에
#                나눠 한 번씩만 실행한다.
#
# main 에 push 되면 verified 가 먼저 돈다. ruleset 이 최신 브랜치를 요구하므로 squash·merge·
# rebase 어느 쪽이든 main 에는 병합한 pull request head 의 트리가 남는다. 이 workflow 가 그
# head 에서 이미 통과했으면 세 job 은 같은 검증을 되풀이하지 않고 건너뛴다. 확인하지 못하면
# 세 job 은 모두 돈다. Release workflow 는 이 실행의 성공을 기다려 게시한다.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A newer push replaces a pull request's run; each main commit keeps a run of its own,
  # since its release waits for that run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # The pull request head this push to main merged, when this workflow already passed on that
  # head and its tree is the pushed commit's tree. Anything else leaves the output empty.
  verified:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.find.outputs.head }}
    steps:
      - name: Find the merged pull request head this workflow passed on
        id: find
        # A failed lookup leaves the output empty, so every job runs and the run still
        # concludes on their results.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "map(select(.merge_commit_sha == \"$SHA\"))[0].head.sha // empty")
          if [ -z "$head" ]; then
            echo "No merged pull request ends at $SHA; every job runs."
            exit 0
          fi
          tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha; }
          if [ "$(tree "$SHA")" != "$(tree "$head")" ]; then
            echo "$SHA does not carry the tree of pull request head $head; every job runs."
            exit 0
          fi
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?event=pull_request&status=success&head_sha=$head" --jq .total_count)
          if [ "$passed" -eq 0 ]; then
            echo "This workflow has not passed on pull request head $head; every job runs."
            exit 0
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "This workflow passed on pull request head $head, whose tree $SHA carries; the jobs skip."

  # Together with runtime and build's no-install tests, this covers every check in local
  # `pnpm test`.
  # Keep the required job names test/build/runtime stable for branch protection.
  test:
    needs: verified
    if: ${{ !cancelled() && !needs.verified.outputs.head }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # No version here on purpose — the action reads packageManager from
          # package.json. Pinning both makes it fail with a version mismatch.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace tests
        env:
          # Reuse compiled modules in child processes, never cached test results.
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm test:workspace

  # What a CONSUMER actually runs. A marketplace install ships no node_modules:
  # the MCP server is an esbuild bundle with its dependencies inlined, and the
  # adr-writer and ontology-writer scripts, hooks, and tests are Node built-ins only. So all of it must
  # work under a bare `node` with no install step — something the pnpm-based jobs
  # cannot tell us, since they always have a populated node_modules.
  runtime:
    needs: verified
    if: ${{ !cancelled() && !needs.verified.outputs.head }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Assert this Node satisfies the declared engines range
        run: |
          node -e '
            const {engines} = require("./package.json");
            const min = engines.node.replace(/[^0-9.]/g, "").split(".").map(Number);
            const cur = process.versions.node.split(".").map(Number);
            const ok = cur[0] > min[0] || (cur[0] === min[0] && (cur[1] ?? 0) >= (min[1] ?? 0));
            if (!ok) { console.error(`node ${process.versions.node} is below engines.node ${engines.node}`); process.exit(1); }
            console.log(`node ${process.versions.node} satisfies engines.node ${engines.node}`);
          '

      # The rest of the dependency-free suites — adr-writer's integration tests and every
      # ontology-writer test — run the way a contributor without pnpm would, in one runner so
      # their files share its workers. build runs adr-writer's unit tests the same way.
      - name: adr-writer integration and ontology-writer suites (no install)
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: node --test "plugins/adr-writer/tests/*.integration.test.mjs" "plugins/ontology-writer/tests/**/*.test.mjs"

      # The committed bundle is what a marketplace install executes. Boot it over
      # stdio and require a well-formed MCP initialize result — a bundle that
      # merely parses is not evidence it runs on this Node.
      - name: alps-writer MCP bundle boots and answers initialize
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 30 node plugins/alps-writer/dist/index.js > /tmp/init.json
          node -e '
            const fs = require("fs");
            const line = fs.readFileSync("/tmp/init.json", "utf8").split("\n").find(Boolean);
            if (!line) { console.error("the server produced no response"); process.exit(1); }
            const res = JSON.parse(line);
            const info = res?.result?.serverInfo;
            if (info?.name !== "alps-writer") { console.error("unexpected initialize result:", line.slice(0, 200)); process.exit(1); }
            console.log(`bundle answered initialize as ${info.name} ${info.version}`);
          '

      # The hook seeds each new or restored session context, so a runtime it
      # cannot start on breaks the plugin when that session begins.
      - name: adr-writer hook runs
        run: echo '{"hook_event_name":"SessionStart","source":"startup"}' | node plugins/adr-writer/hooks/surface-adr-context.mjs

      - name: ontology-writer hook runs
        run: echo '{"hook_event_name":"SessionStart","source":"startup"}' | node plugins/ontology-writer/hooks/surface-business-context.mjs

  build:
    needs: verified
    if: ${{ !cancelled() && !needs.verified.outputs.head }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # adr-writer's dependency-free unit tests, before anything is installed, as a
      # contributor without pnpm runs them; runtime runs the rest. This job has the time.
      - name: adr-writer unit tests (no install)
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: node --test "plugins/adr-writer/tests/!(*.integration).test.mjs"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The release version lives in 16 sites; the five rules-version stamps in
      # templates/adr/ are covered by no test. A stamp left behind makes the
      # plugin report its own templates as stale to every consumer at once.
      - name: Check version consistency
        run: pnpm bump:check

      # plugins/alps-writer/dist/ is committed — the marketplace installs run it
      # directly. Rebuild and fail if the result differs from what was pushed,
      # which is exactly the "src changed but dist/ wasn't rebuilt" case the
      # pre-commit hook handles locally and --no-verify defeats.
      - name: Build
        run: pnpm build

      - name: Verify the committed bundle is up to date
        run: |
          if ! git diff --quiet -- plugins/alps-writer/dist; then
            echo "::error::plugins/alps-writer/dist/ is stale — run 'pnpm build' and commit the result."
            git diff --stat -- plugins/alps-writer/dist
            exit 1
          fi
          echo "committed bundle matches a fresh build"
