[run]
# Package bins (prettier, eslint, tsc, husky, …) declare `#!/usr/bin/env node`.
# Run them on Bun as well.
bun = true

[test]
# The git preload keeps the macOS xcrun shim out of the thousands of git
# processes the tests start; the environment preload gives every process a test
# starts the test's time zone and forbids Bun's on-the-fly package installs.
preload = ["./scripts/test-git.mjs", "./scripts/test-env.mjs"]
